on:
  push:
    branches:
      - master
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"

name: Tests
jobs:
  Build:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
        continue-on-error: true

      # 多模块仓库：各模块含 replace ../.. 指向核心库，独立循环测试
      # coverage-<name>.txt 统一落仓库根，供 Codecov 一次上传
      - name: Test (with coverage)
        run: |
          set -e
          test_module() {
            local dir="$1" name="$2"
            echo "::group::Tests: $name"
            if command -v gotestsum >/dev/null 2>&1; then
              (cd "$dir" && gotestsum -f testname -- ./... -race -count=1 -timeout=10m -coverprofile="../coverage-$name.txt" -covermode=atomic -shuffle=on)
            else
              (cd "$dir" && go test ./... -race -count=1 -timeout=10m -coverprofile="../coverage-$name.txt" -covermode=atomic -shuffle=on)
            fi
            echo "::endgroup::"
          }
          test_module . core
          test_module ./adapters/openai openai
          test_module ./adapters/anthropic anthropic
          test_module ./adapters/ollama ollama
          test_module ./adapters/vectorstores/memory vectorstores-memory
        timeout-minutes: 30
        continue-on-error: true # 即使测试失败也继续

      - name: Check coverage files exist
        id: check_coverage
        if: matrix.go-version == '1.25.x'
        run: |
          if ls coverage-*.txt >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Coverage files exist"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No coverage files found"
          fi
        shell: bash
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        if: always() && steps.check_coverage.outputs.exists == 'true'
        uses: codecov/codecov-action@v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-core.txt,./coverage-openai.txt,./coverage-anthropic.txt,./coverage-ollama.txt,./coverage-vectorstores-memory.txt
          flags: unittests
          slug: kamalyes/go-llmx
          fail_ci_if_error: false # 上传失败不影响 CI
        continue-on-error: true # 上传失败也不影响整个流程
